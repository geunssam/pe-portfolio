<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>협업 신청 · 근쌤의 서재</title>
  <meta name="description" content="근쌤에게 연수·강의, 학교 컨설팅, 체육 수업 앱, 원고 협업을 신청합니다.">
  <meta name="theme-color" content="#F6F8FC">
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body class="sunlight">

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html#contact">← 근쌤</a>
    </div>
  </header>

  <main class="wrap apply">
    <div class="apply-head">
      <h1 class="apply-title">협업 신청하기</h1>
      <p class="small">보내 주신 내용은 근쌤 메일로 바로 전달돼요. 확인 후 연락드릴게요.</p>
      <div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- Netlify 폼: 보내면 Netlify에 저장되고, 사이트 알림 설정으로 근쌤 메일에 전달됨 -->
    <form class="apply-form" name="collab" method="POST" action="thanks.html" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="collab">
      <p class="hp" aria-hidden="true"><label>비워 두세요 <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

      <fieldset class="group">
        <legend>누구신가요</legend>
        <div class="field-row">
          <label class="field"><span>이름 <b>*</b></span><input id="f-name" name="이름" required autocomplete="name"></label>
          <label class="field"><span>소속 (학교·기관) <b>*</b></span><input id="f-org" name="소속" required autocomplete="organization"></label>
        </div>
        <div class="field-row">
          <label class="field"><span>메일 <b>*</b></span><input id="f-email" name="메일" type="email" required autocomplete="email" inputmode="email"></label>
          <label class="field"><span>전화 (선택)</span><input id="f-phone" name="전화" type="tel" autocomplete="tel" inputmode="tel"></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>무엇을 함께할까요 <b>*</b></legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="신청 종류" value="AI 교사 연수·강의" required> AI 교사 연수·강의</label>
          <label class="choice"><input type="radio" name="신청 종류" value="학교 컨설팅"> 학교 컨설팅</label>
          <label class="choice"><input type="radio" name="신청 종류" value="체육 수업 앱 협업"> 체육 수업 앱 협업</label>
          <label class="choice"><input type="radio" name="신청 종류" value="원고·집필"> 원고·집필</label>
          <label class="choice"><input type="radio" name="신청 종류" value="기타"> 기타</label>
        </div>
        <div class="field-row">
          <label class="field"><span>희망 날짜·시간</span><input id="f-date" name="희망 일정" placeholder="예: 11월 둘째 주 수요일 오후 3시~5시"></label>
          <label class="field"><span>대상·인원</span><input id="f-audience" name="대상·인원" placeholder="예: 초등 교사 30명"></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>강의료·협업비 <b>*</b></legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="비용 방식" value="시간당 금액" required> 시간당 금액</label>
          <label class="choice"><input type="radio" name="비용 방식" value="총액"> 총액</label>
          <label class="choice"><input type="radio" name="비용 방식" value="기관 규정에 따름"> 기관 규정에 따름</label>
          <label class="choice"><input type="radio" name="비용 방식" value="협의 희망"> 협의하고 싶어요</label>
        </div>
        <label class="field"><span>금액 (선택)</span><input id="f-fee" name="금액" placeholder="예: 시간당 15만 원 / 총 40만 원"></label>
        <p class="field-label">교통비·숙박 지원</p>
        <div class="choices">
          <label class="choice"><input type="radio" name="교통비·숙박" value="있음"> 있음</label>
          <label class="choice"><input type="radio" name="교통비·숙박" value="없음"> 없음</label>
          <label class="choice"><input type="radio" name="교통비·숙박" value="협의"> 협의</label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>하고 싶은 이야기</legend>
        <label class="field"><span class="sr-only">내용</span><textarea id="f-message" name="내용" rows="6" placeholder="연수 주제, 원하는 내용, 궁금한 점을 자유롭게 적어 주세요."></textarea></label>
      </fieldset>

      <label class="consent"><input id="f-consent" type="checkbox" name="개인정보 동의" value="동의" required> 이름·소속·연락처는 협업 연락에만 쓰고, 일이 끝나면 지웁니다. 동의합니다. <b>*</b></label>

      <button class="btn submit" type="submit">보내기 →</button>
    </form>
  </main>

  <footer class="wrap footer">© 근쌤의 서재</footer>
</body>
</html>
